name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 11 RC3 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-rc.3.26522.148
          dotnet-quality: preview

      - name: Set up Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Publish self-contained Windows app
        shell: pwsh
        run: >-
          msbuild GalaxyWearable.Windows/GalaxyWearable.Windows.csproj
          /restore
          /target:Publish
          /property:Configuration=Release
          /property:RuntimeIdentifier=win-x64
          /property:SelfContained=true
          /property:PublishDir=publish/win-x64/
          /property:Platform=x64
          /property:WindowsPackageType=None
          /property:EnableMsixTooling=false
          /property:WindowsAppSDKSelfContained=true

      - name: Upload Windows x64 build
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Wearable-Windows-win-x64
          path: publish/win-x64/
          if-no-files-found: error
          retention-days: 14
