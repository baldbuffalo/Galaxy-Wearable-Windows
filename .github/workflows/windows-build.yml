name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Only publish the newest main revision. Older queued builds must not finish later
# and overwrite the latest-release pointer with an older executable.
concurrency:
  group: galaxy-wearable-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: Build unpackaged Windows app
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install .NET 10 SDK
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "dotnet"
          $installer = Join-Path $env:RUNNER_TEMP "dotnet-install.ps1"
          Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile $installer

          & $installer -Version "10.0.403" -AzureFeed "https://dotnetcli.azureedge.net/dotnet" -InstallDir $installDir -NoPath
          if (!(Test-Path (Join-Path $installDir "dotnet.exe"))) {
            throw ".NET SDK installer finished without creating dotnet.exe."
          }

          $sdk = Join-Path $installDir "dotnet.exe"
          if (!(Test-Path $sdk)) {
            throw ".NET SDK executable was not installed."
          }

          $installedVersion = (& $sdk --version).Trim()
          if ($installedVersion -ne "10.0.403") {
            throw "Expected .NET SDK 10.0.403, found $installedVersion."
          }

          Add-Content -Path $env:GITHUB_PATH -Value $installDir
          Add-Content -Path $env:GITHUB_ENV -Value "DOTNET_ROOT=$installDir"

      - name: Set up Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Publish self-contained WinUI app (single executable)
        shell: pwsh
        run: >-
          msbuild GalaxyWearable.Windows/GalaxyWearable.Windows.csproj
          /restore
          /target:Publish
          /property:Configuration=Release
          /property:RuntimeIdentifier=win-x64
          /property:SelfContained=true
          /property:PublishSingleFile=true
          /property:IncludeAllContentForSelfExtract=true
          /property:IncludeNativeLibrariesForSelfExtract=true
          /property:PublishDir=../dist/GalaxyWearable-Windows/win-x64/
          /property:Platform=x64
          /property:WindowsPackageType=None
          /property:EnableMsixTooling=true
          /property:WindowsAppSDKSelfContained=true
          /property:PublishTrimmed=false
          /property:PublishAot=false
          /property:PublishReadyToRun=false
          /property:Version=1.0.${{ github.run_number }}.0

      - name: Verify single-file executable
        shell: pwsh
        run: |
          $publishDir = "dist/GalaxyWearable-Windows/win-x64"
          $publishedApp = Join-Path $publishDir "GalaxyWearable.Windows.exe"
          if (!(Test-Path $publishedApp)) {
            throw "Published executable not found at $publishedApp"
          }

          # Get-ChildItem returns absolute paths; normalize both sides before comparing.
          $publishedAppFullPath = [System.IO.Path]::GetFullPath((Resolve-Path $publishedApp).Path)
          $otherFiles = Get-ChildItem $publishDir -File -Recurse | Where-Object {
            [System.IO.Path]::GetFullPath($_.FullName) -ine $publishedAppFullPath
          }
          if ($otherFiles.Count -gt 0) {
            $otherFiles | ForEach-Object { Write-Host "Unexpected external file: $($_.FullName)" }
            throw "Single-file publish produced external files; refusing to publish an EXE that may be incomplete."
          }

      - name: Remove previous releases and all tags
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          # Remove published releases and their associated tags first.
          $releaseTags = gh release list --limit 1000 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) {
            throw "Could not list existing GitHub releases."
          }

          foreach ($tag in $releaseTags) {
            if ([string]::IsNullOrWhiteSpace($tag)) { continue }
            Write-Host "Deleting old release and tag: $tag"
            gh release delete $tag --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) {
              throw "Could not delete release/tag $tag."
            }
          }

          # Also remove orphaned tags that do not have a GitHub release.
          $tagRefs = gh api --paginate "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags" --jq '.[].ref'
          if ($LASTEXITCODE -ne 0) {
            throw "Could not list existing Git tags."
          }

          foreach ($ref in $tagRefs) {
            if ([string]::IsNullOrWhiteSpace($ref)) { continue }
            $relativeRef = $ref.Substring("refs/".Length)
            Write-Host "Deleting remaining Git tag: $ref"
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/$relativeRef"
            if ($LASTEXITCODE -ne 0) {
              throw "Could not delete Git tag $ref."
            }
          }

      - name: Publish GitHub release with direct executable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Galaxy Wearable Windows build ${{ github.run_number }}
          target_commitish: main
          make_latest: true
          generate_release_notes: true
          files: |
            dist/GalaxyWearable-Windows/win-x64/GalaxyWearable.Windows.exe
