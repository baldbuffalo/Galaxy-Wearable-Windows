name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403

      - name: Set up Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Publish self-contained Windows app
        shell: pwsh
        run: >-
          msbuild GalaxyWearable.Windows/GalaxyWearable.Windows.csproj
          /restore
          /target:Publish
          /property:Configuration=Release
          /property:RuntimeIdentifier=win-x64
          /property:SelfContained=true
          /property:PublishDir=GalaxyWearable.Windows/publish/win-x64/
          /property:Platform=x64
          /property:WindowsPackageType=None
          /property:EnableMsixTooling=false
          /property:WindowsAppSDKSelfContained=true

      - name: Upload Windows x64 build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Galaxy-Wearable-Windows-win-x64
          path: GalaxyWearable.Windows/GalaxyWearable.Windows/publish/win-x64/
          if-no-files-found: error
          retention-days: 14
