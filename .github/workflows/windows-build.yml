name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build single-file Windows app
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.403

      - name: Set up Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Publish self-contained single-file WinUI app
        shell: pwsh
        run: >-
          msbuild GalaxyWearable.Windows/GalaxyWearable.Windows.csproj
          /restore
          /target:Publish
          /property:Configuration=Release
          /property:RuntimeIdentifier=win-x64
          /property:SelfContained=true
          /property:PublishSingleFile=true
          /property:IncludeAllContentForSelfExtract=true
          /property:IncludeNativeLibrariesForSelfExtract=true
          /property:PublishDir=../dist/GalaxyWearable-Windows/win-x64/
          /property:Platform=x64
          /property:WindowsPackageType=None
          /property:EnableMsixTooling=true
          /property:WindowsAppSDKSelfContained=true
          /property:PublishTrimmed=false
          /property:PublishAot=false
          /property:PublishReadyToRun=false

      - name: Verify single-EXE publish
        shell: pwsh
        run: |
          $publishedApp = "dist/GalaxyWearable-Windows/win-x64/GalaxyWearable.Windows.exe"
          if (!(Test-Path $publishedApp)) {
            throw "Published app not found at $publishedApp"
          }
          $looseDlls = Get-ChildItem "dist/GalaxyWearable-Windows/win-x64" -Filter "*.dll" -File
          if ($looseDlls.Count -gt 0) {
            $names = ($looseDlls | ForEach-Object { $_.Name }) -join ", "
            throw "Single-file publish left external DLLs: $names"
          }

      - name: Prepare single downloadable EXE
        shell: pwsh
        run: |
          $publishedApp = "dist/GalaxyWearable-Windows/win-x64/GalaxyWearable.Windows.exe"
          if (!(Test-Path $publishedApp)) {
            throw "Published single-file app was not found at $publishedApp"
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $publishedApp "dist/GalaxyWearable.exe" -Force

          $size = (Get-Item "dist/GalaxyWearable.exe").Length
          if ($size -lt 1MB) {
            throw "GalaxyWearable.exe is unexpectedly small ($size bytes); refusing to publish an incomplete app."
          }

      - name: Upload single-file app
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Galaxy-Wearable-Windows
          path: dist/GalaxyWearable.exe
          if-no-files-found: error
          retention-days: 14
