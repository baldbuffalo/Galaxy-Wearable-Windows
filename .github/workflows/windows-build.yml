name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build unpackaged Windows app
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install .NET 10 SDK
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "dotnet"
          $installer = Join-Path $env:RUNNER_TEMP "dotnet-install.ps1"
          Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile $installer

          & $installer -Version "10.0.403" -AzureFeed "https://dotnetcli.azureedge.net/dotnet" -InstallDir $installDir -NoPath
          if ($LASTEXITCODE -ne 0) {
            throw ".NET SDK installation failed with exit code $LASTEXITCODE."
          }

          $sdk = Join-Path $installDir "dotnet.exe"
          if (!(Test-Path $sdk)) {
            throw ".NET SDK executable was not installed."
          }

          $installedVersion = (& $sdk --version).Trim()
          if ($installedVersion -ne "10.0.403") {
            throw "Expected .NET SDK 10.0.403, found $installedVersion."
          }

          Add-Content -Path $env:GITHUB_PATH -Value $installDir
          Add-Content -Path $env:GITHUB_ENV -Value "DOTNET_ROOT=$installDir"

      - name: Set up Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Publish self-contained WinUI app (loose files)
        shell: pwsh
        run: >-
          msbuild GalaxyWearable.Windows/GalaxyWearable.Windows.csproj
          /restore
          /target:Publish
          /property:Configuration=Release
          /property:RuntimeIdentifier=win-x64
          /property:SelfContained=true
          /property:PublishSingleFile=false
          /property:IncludeAllContentForSelfExtract=true
          /property:IncludeNativeLibrariesForSelfExtract=true
          /property:PublishDir=../dist/GalaxyWearable-Windows/win-x64/
          /property:Platform=x64
          /property:WindowsPackageType=None
          /property:EnableMsixTooling=true
          /property:WindowsAppSDKSelfContained=true
          /property:PublishTrimmed=false
          /property:PublishAot=false
          /property:PublishReadyToRun=false

      - name: Verify loose-file publish
        shell: pwsh
        run: |
          $publishDir = "dist/GalaxyWearable-Windows/win-x64"
          $publishedApp = Join-Path $publishDir "GalaxyWearable.Windows.exe"
          if (!(Test-Path $publishedApp)) {
            throw "Published app not found at $publishedApp"
          }

          $looseDlls = Get-ChildItem $publishDir -Filter "*.dll" -File
          if ($looseDlls.Count -eq 0) {
            throw "Expected supporting DLLs beside the executable, but none were found."
          }

          $xamlDll = Get-ChildItem $publishDir -Filter "Microsoft.UI.Xaml.dll" -Recurse -File
          if ($xamlDll.Count -eq 0) {
            throw "Microsoft.UI.Xaml.dll was not found in the publish output."
          }

      - name: Verify no nested ZIP files
        shell: pwsh
        run: |
          $nestedZips = Get-ChildItem "dist/GalaxyWearable-Windows/win-x64" -Filter "*.zip" -Recurse -File
          if ($nestedZips.Count -gt 0) {
            throw "Publish output contains nested ZIP files; expected loose app files only."
          }

      - name: Upload Windows app files as one artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Galaxy-Wearable-Windows
          path: dist/GalaxyWearable-Windows/win-x64/
          if-no-files-found: error
          retention-days: 14
